# Biashara24 on one server: PostgreSQL, the API, the web app with automatic HTTPS,
# and daily backups. Run from this folder: docker compose up -d --build
# Settings come from deploy/.env (copy .env.example and fill it in).

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biashara}
      POSTGRES_USER: ${POSTGRES_USER:-biashara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      TZ: Africa/Nairobi
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-biashara}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-biashara}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in deploy/.env}
      ALLOWED_ORIGINS: https://${DOMAIN:-localhost}
      BUSINESS_TIMEZONE: Africa/Nairobi
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging: *logging

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-biashara}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-biashara}
      TZ: Africa/Nairobi
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
    volumes:
      - ./backups:/backups
      - ./rclone:/root/.config/rclone
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:
